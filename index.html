<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliza Ludo Pro</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:0;font-family:Roboto,sans-serif;background:linear-gradient(135deg,#1f1c2c,#928dab);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{color:#ffd700;text-shadow:0 0 10px #ffd700;margin-bottom:20px;}
.card{background:rgba(255,255,255,0.05);border-radius:20px;padding:20px;margin-bottom:20px;border:2px solid #ffd700;box-shadow:0 8px 30px rgba(0,0,0,0.5),0 0 20px rgba(255,255,0,0.2);backdrop-filter:blur(10px);width:100%;max-width:600px;transition:0.4s;}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,0.7),0 0 25px rgba(255,255,0,0.4);}
button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px;}
input{padding:8px;border-radius:6px;width:100%;margin:6px 0;}
#board{display:grid;grid-template-columns:repeat(15,40px);grid-template-rows:repeat(15,40px);gap:1px;margin-bottom:20px;}
.cell{width:40px;height:40px;background:#333;display:flex;justify-content:center;align-items:center;font-size:18px;border-radius:4px;}
.cell.red{background:#e74c3c;}
.cell.green{background:#2ecc71;}
.cell.yellow{background:#f1c40f;color:#000;}
.cell.blue{background:#3498db;}
.cell.home{background:#fff;border:2px solid #000;}
#chat{max-height:200px;overflow-y:auto;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;margin-bottom:10px;}
.message{padding:5px;border-radius:6px;margin-bottom:4px;background:rgba(255,255,255,0.1);}
#wallet{margin-top:10px;font-weight:bold;}
#whatsapp-btn{position:fixed;bottom:25px;right:25px;background:#25D366;color:#fff;border-radius:50%;width:60px;height:60px;display:flex;justify-content:center;align-items:center;font-size:30px;box-shadow:0 5px 15px rgba(0,0,0,0.3);cursor:pointer;z-index:1000;transition:0.3s;}
#whatsapp-btn:hover{transform:scale(1.1);box-shadow:0 8px 20px rgba(0,0,0,0.5);}
</style>
</head>
<body>
<h1>Aliza Ludo Pro</h1>

<!-- User Profile & Wallet -->
<div class="card">
<button onclick="googleLogin()">Login with Google / Fast Login</button>
<p id="user-info">Not logged in</p>
<p id="wallet">Coins: 0</p>
<input type="text" id="displayName" placeholder="Change Display Name">
<input type="file" id="profilePic">
<button onclick="updateProfile()">Update Profile</button>
<img id="dp" src="" width="60" height="60" style="border-radius:50%;margin-top:5px;">
<button onclick="rechargeCoins()">Recharge 50,000 coins (PKR 210)</button>
</div>

<!-- Chat / Inbox -->
<div class="card">
<h2>Inbox / Chat</h2>
<input type="text" id="searchUser" placeholder="Search user by name">
<button onclick="searchUser()">Search</button>
<div id="chat"></div>
<input type="text" id="msgInput" placeholder="Type message">
<button onclick="sendMessage()">Send</button>
</div>

<!-- Ludo Board -->
<div class="card">
<h2>Ludo Board</h2>
<div id="board"></div>
<div id="dice">🎲 Roll: 0</div>
<button onclick="rollDice()">Roll Dice</button>
<p id="turn">Turn: Player 1 (Red)</p>
<p id="bet-status"></p>
<input type="number" id="betAmount" placeholder="Enter bet coins (>=5000)">
<button onclick="placeBet()">Place Bet & Play</button>
</div>

<div id="whatsapp-btn" onclick="openWhatsApp()">💬</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentUser=null;
let coins=0;
const minBet=5000;

// Google login
function googleLogin(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(result=>{
    currentUser=result.user;
    document.getElementById("user-info").innerText=`Hello ${currentUser.displayName}`;
    if(!localStorage.getItem(currentUser.uid+"_coins")){
      coins=50000;
      localStorage.setItem(currentUser.uid+"_coins",coins);
    } else coins=localStorage.getItem(currentUser.uid+"_coins");
    document.getElementById("wallet").innerText="Coins: "+coins;
    if(currentUser.photoURL) document.getElementById("dp").src=currentUser.photoURL;
  });
}

// Update profile
function updateProfile(){
  const name=document.getElementById("displayName").value;
  const file=document.getElementById("profilePic").files[0];
  if(name) currentUser.updateProfile({displayName:name}).then(()=>document.getElementById("user-info").innerText="Hello "+name);
  if(file){
    const ref=storage.ref('profilePics/'+currentUser.uid);
    ref.put(file).then(()=>ref.getDownloadURL().then(url=>currentUser.updateProfile({photoURL:url}).then(()=>document.getElementById("dp").src=url)));
  }
}

// Recharge coins
function rechargeCoins(){ coins+=50000; localStorage.setItem(currentUser.uid+"_coins",coins); document.getElementById("wallet").innerText="Coins: "+coins; alert("50,000 coins added!");}

// Chat placeholder
function searchUser(){ alert("Search placeholder (connect Firestore for real)");}
function sendMessage(){ const msg=document.getElementById("msgInput").value; if(!msg) return; const chatDiv=document.getElementById("chat"); const msgEl=document.createElement("div"); msgEl.classList.add("message"); msgEl.innerText=currentUser.displayName+": "+msg; chatDiv.appendChild(msgEl); document.getElementById("msgInput").value="";}

// WhatsApp
function openWhatsApp(){ const number="03491441853"; window.open(`https://wa.me/${number}?text=Hello Aliza Support!`,'_blank');}

// Ludo Board setup
const board=document.getElementById("board");
const boardSize=15; let cells=[];
for(let i=0;i<boardSize*boardSize;i++){const div=document.createElement("div"); div.classList.add("cell"); board.appendChild(div); cells.push(div);}
const players=["Red","Green","Yellow","Blue"];
let turnIndex=0; let diceValue=0;

function rollDice(){diceValue=Math.floor(Math.random()*6)+1;document.getElementById("dice").innerText="🎲 Roll: "+diceValue;alert(players[turnIndex]+" rolled "+diceValue);}

function nextTurn(){turnIndex=(turnIndex+1)%players.length; document.getElementById("turn").innerText="Turn: Player "+(turnIndex+1)+" ("+players[turnIndex]+")";}

// Place bet & play
function placeBet(){
  const bet=parseInt(document.getElementById("betAmount").value);
  if(!bet || bet<minBet){ alert("Minimum bet is 5000 coins"); return;}
  if(coins<bet){ alert("Not enough coins"); return;}
  coins-=bet; localStorage.setItem(currentUser.uid+"_coins",coins);
  document.getElementById("wallet").innerText="Coins: "+coins;
  document.getElementById("bet-status").innerText="Bet placed: "+bet+" coins";
  rollDice();
  nextTurn();
}
</script>
</body>
  </html>
