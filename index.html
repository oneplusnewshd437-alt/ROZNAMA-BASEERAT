<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliza Ludo - Full Game</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body,html{margin:0;padding:0;height:100%;font-family:Roboto,sans-serif;background:linear-gradient(135deg,#1f1c2c,#928dab);display:flex;justify-content:center;align-items:center;}
#ludo-template{width:400px;height:400px;background:#222;border-radius:15px;display:flex;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 0 30px #ffd700;text-align:center;color:#ffd700;font-size:24px;font-weight:bold;transition:0.4s;}
#ludo-template:hover{transform:scale(1.05);box-shadow:0 0 50px #ffd700;}
#ludo-game{display:none;flex-direction:column;align-items:center;width:100vw;height:100vh;}
#board{display:grid;grid-template-columns:15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr 15fr;grid-template-rows:repeat(15,1fr);width:90vmin;height:90vmin;gap:1px;background:#000;border:5px solid #ffd700;}
.cell{border-radius:3px;width:100%;height:100%;display:flex;justify-content:center;align-items:center;}
.red{background:#e74c3c;}
.green{background:#2ecc71;}
.yellow{background:#f1c40f;color:#000;}
.blue{background:#3498db;}
.home{background:#fff;border:2px solid #000;}
.piece{width:60%;height:60%;border-radius:50%;border:2px solid #000;cursor:pointer;}
#dice{font-size:40px;margin:10px;cursor:pointer;user-select:none;}
#turn{text-align:center;font-size:20px;margin:10px;color:#ffd700;}
#wallet{color:#fff;font-size:18px;margin:10px;}
#bet-status{color:#00ff00;font-weight:bold;margin:5px;}
</style>
</head>
<body>

<!-- Ludo Template Card -->
<div id="ludo-template">Click to Play Ludo</div>

<!-- Full Ludo Game -->
<div id="ludo-game">
<p id="wallet">Coins: 50000</p>
<div id="board"></div>
<div id="dice">🎲 Roll</div>
<p id="turn">Turn: Player 1 (Red)</p>
<p id="bet-status"></p>
<input type="number" id="betAmount" placeholder="Enter bet (>=5000)">
<button onclick="placeBet()">Place Bet & Play</button>
</div>

<script>
// Open Ludo Game
document.getElementById("ludo-template").onclick=function(){
  this.style.display="none";
  document.getElementById("ludo-game").style.display="flex";
}

// Board setup
const board=document.getElementById("board");
const cells=[];
for(let i=0;i<15*15;i++){
  const div=document.createElement("div");
  div.classList.add("cell");
  board.appendChild(div);
  cells.push(div);
}
// Example: Add home colors (simplified)
for(let i=0;i<6;i++){
  for(let j=0;j<6;j++){
    cells[i*15+j].classList.add("red");
    cells[i*15+(14-j)].classList.add("green");
    cells[(14-i)*15+j].classList.add("yellow");
    cells[(14-i)*15+(14-j)].classList.add("blue");
  }
}

// Pieces setup
const players=["red","green","yellow","blue"];
let pieces={};
players.forEach(color=>{
  pieces[color]=[];
  for(let i=0;i<4;i++){
    const p=document.createElement("div");p.classList.add("piece");p.style.background=color;
    pieces[color].push(p);
  }
});

// Dice & turns
let coins=50000;
let turnIndex=0;
let diceValue=0;
const minBet=5000;

document.getElementById("dice").onclick=function(){
  diceValue=Math.floor(Math.random()*6)+1;
  this.innerText="🎲 "+diceValue;
  alert(players[turnIndex]+" rolled "+diceValue);
}

function nextTurn(){
  turnIndex=(turnIndex+1)%players.length;
  document.getElementById("turn").innerText="Turn: Player "+(turnIndex+1)+" ("+players[turnIndex]+")";
}

function placeBet(){
  const bet=parseInt(document.getElementById("betAmount").value);
  if(!bet || bet<minBet){ alert("Minimum bet is 5000 coins"); return;}
  if(coins<bet){ alert("Not enough coins"); return;}
  coins-=bet;
  document.getElementById("wallet").innerText="Coins: "+coins;
  document.getElementById("bet-status").innerText="Bet placed: "+bet+" coins";
  document.getElementById("dice").click();
  nextTurn();
}
</script>
</body>
</html>
