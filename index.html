<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hina Prime Store</title>
<style>
body {margin:0;font-family:Arial;background:#f5f5f5;}header { background:#ff5722; padding:10px; color:#fff; }

.header-top { display:flex; gap:10px; }

.search { flex:1; padding:10px; border:none; border-radius:5px; }

.container {padding:10px;}

.banner { background:#ff7043; color:#fff; padding:20px; border-radius:10px; text-align:center; margin-bottom:15px; }

.categories { display:flex; overflow:auto; gap:10px; margin-bottom:15px; }

.cat { background:#fff; padding:10px; border-radius:10px; min-width:80px; text-align:center; font-size:12px; }

form { background:#fff; padding:15px; border-radius:10px; margin-bottom:20px; }

input, textarea { width:100%; margin:8px 0; padding:10px; border-radius:5px; border:1px solid #ccc; }

button { background:#ff5722; color:#fff; border:none; padding:10px; border-radius:5px; }

.products { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }

.card { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.1); }

.card img {width:100%;height:150px;object-fit:cover;}

.card-content {padding:10px;}

.price {color:#ff5722;font-weight:bold;}

.bottom-nav { position:fixed; bottom:0; width:100%; background:#fff; display:flex; justify-content:space-around; padding:10px 0; box-shadow:0 -2px 5px rgba(0,0,0,0.1); }

</style>
</head>
<body><header>
    <div class="header-top">
        <input type="text" id="search" class="search" placeholder="Search in Hina Store">
    </div>
</header><div class="container"><div class="banner">🔥 Hina PRIME STORE Deals 🔥</div><div class="categories">
    <div class="cat">Mobile</div>
    <div class="cat">Clothes</div>
    <div class="cat">Shoes</div>
    <div class="cat">Electronics</div>
    <div class="cat">Beauty</div>
</div><form id="form">
    <input type="text" id="name" placeholder="Product Name" required>
    <input type="number" id="price" placeholder="Price" required>
    <input type="text" id="location" placeholder="Location" required>
    <input type="file" id="image" required>
    <textarea id="desc" placeholder="Description"></textarea>
    <button>Add Product</button>
</form><div class="products" id="products"></div></div><div class="bottom-nav">
    <div>🏠 Home</div>
    <div>🛒 Cart</div>
    <div>➕ Sell</div>
    <div>👤 Account</div>
</div><script>
let data = [
    {
        name: "iPhone 13",
        price: "180000",
        location: "Lahore",
        desc: "Used but like new",
        img: "https://images.unsplash.com/photo-1632661674596-df8be070a5c5"
    },
    {
        name: "Men Sneakers",
        price: "4500",
        location: "Karachi",
        desc: "Comfortable running shoes",
        img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
    },
    {
        name: "Ladies Handbag",
        price: "3200",
        location: "Islamabad",
        desc: "Stylish handbag",
        img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3"
    },
    {
        name: "Smart Watch",
        price: "7000",
        location: "Faisalabad",
        desc: "Fitness tracking watch",
        img: "https://images.unsplash.com/photo-1518441902110-6a4c9f6d2f9c"
    }
];

// show default products on load
window.onload = () => show(data);
const form = document.getElementById('form');
const productsDiv = document.getElementById('products');
const search = document.getElementById('search');

form.onsubmit = e => {
    e.preventDefault();

    const file = document.getElementById('image').files[0];
    const reader = new FileReader();

    reader.onload = () => {
        const item = {
            name: name.value,
            price: price.value,
            location: location.value,
            desc: desc.value,
            img: reader.result
        };

        data.push(item);
        show(data);
    };

    reader.readAsDataURL(file);
    form.reset();
};

function show(arr){
    productsDiv.innerHTML = '';
    arr.forEach(p=>{
        productsDiv.innerHTML += `
        <div class="card">
            <img src="${p.img}">
            <div class="card-content">
                <div>${p.name}</div>
                <div class="price">Rs ${p.price}</div>
                <small>${p.location}</small>
            </div>
        </div>`;
    });
}

search.oninput = ()=>{
    const val = search.value.toLowerCase();
    const filtered = data.filter(p=>p.name.toLowerCase().includes(val));
    show(filtered);
};
</script></body>
</html>
