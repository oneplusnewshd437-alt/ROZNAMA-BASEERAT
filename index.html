<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hina Prime Store</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: #fff;
}header { display: flex; justify-content: center; padding: 20px; }

.header-card { background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); font-size: 26px; font-weight: bold; }

.container { padding: 20px; }

form { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; }

button { padding: 12px; background: linear-gradient(45deg, #ff416c, #ff4b2b); color: #fff; border: none; border-radius: 8px; cursor: pointer; }

.products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }

.card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); transition: 0.3s; }

.card:hover { transform: scale(1.05); }

img { width: 100%; border-radius: 10px; margin-bottom: 10px; }

.search-box { margin-top: 20px; }

</style>
</head>
<body><header>
    <div class="header-card">Hina PRIME STORE</div>
</header><div class="container"><h2>Upload Product</h2>
<form id="productForm">
    <input type="text" id="name" placeholder="Product Name" required>
    <input type="number" id="price" placeholder="Price" required>
    <input type="text" id="location" placeholder="Location" required>
    <input type="file" id="image" accept="image/*" required>
    <textarea id="desc" placeholder="Description"></textarea>
    <button type="submit">Add Product</button>
</form><div class="search-box">
    <input type="text" id="search" placeholder="Search product...">
</div><div class="products" id="productList"></div></div><script>
const form = document.getElementById('productForm');
const list = document.getElementById('productList');
const search = document.getElementById('search');
let products = [];

form.addEventListener('submit', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value;
    const location = document.getElementById('location').value;
    const desc = document.getElementById('desc').value;
    const imageFile = document.getElementById('image').files[0];

    const reader = new FileReader();
    reader.onload = function() {
        const product = { name, price, location, desc, image: reader.result };
        products.push(product);
        displayProducts(products);
    };
    reader.readAsDataURL(imageFile);

    form.reset();
});

function displayProducts(items) {
    list.innerHTML = '';
    items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${p.image}">
            <h3>${p.name}</h3>
            <p><b>Price:</b> ${p.price}</p>
            <p><b>Location:</b> ${p.location}</p>
            <p>${p.desc}</p>
        `;
        list.appendChild(card);
    });
}

search.addEventListener('input', () => {
    const value = search.value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(value));
    displayProducts(filtered);
});
</script></body>
</html>
