<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aliza - Decentralized Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5/dist/ethers.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family:'Roboto',sans-serif; margin:0; padding:0; background:linear-gradient(135deg,#1f1c2c,#928dab); color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
.container { max-width:1200px; width:100%; display:flex; flex-direction:column; align-items:center; }
h1 { font-size:2.5rem; color:#ffd700; margin-bottom:40px; text-shadow:0 0 15px #ffd700; text-align:center; }
.card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; margin-bottom: 30px; border: 2px solid #ffd700; box-shadow: 0 8px 30px rgba(0,0,0,0.5),0 0 20px rgba(255,255,0,0.2); backdrop-filter:blur(10px); width:100%; max-width:600px; transition:0.4s; }
.card:hover { transform: translateY(-10px); box-shadow:0 15px 40px rgba(0,0,0,0.7),0 0 25px rgba(255,255,0,0.4); }
.card h2 { margin-bottom:15px; color:#ffd700; }
.btn { display:block; width:100%; padding:14px 0; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; transition:0.3s; }
.btn-wallet { background:#28a745; color:#fff; }
.btn-wallet:hover { background:#218838; transform:scale(1.05);}
.btn-deposit { background:#007bff; color:#fff; }
.btn-deposit:hover { background:#0056b3; transform:scale(1.05);}
input[type="text"],input[type="number"] { padding:12px; width:100%; margin-bottom:12px; border-radius:12px; border:none; font-size:16px; outline:none; background:rgba(255,255,255,0.1); color:#fff; }
input::placeholder { color: #ccc; }
#wallet-status,#deposit-status,#token-balance,#live-profit { margin-top:10px; font-weight:bold; font-size:1rem; }

/* --- WhatsApp floating button --- */
#whatsapp-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background:#25D366;
  color:#fff;
  border-radius:50%;
  width:60px;
  height:60px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  cursor:pointer;
  z-index:1000;
  transition:0.3s;
}
#whatsapp-btn:hover { transform: scale(1.1); box-shadow:0 8px 20px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="container">
<h1>Aliza - Decentralized Dashboard</h1>

<!-- Wallet Connect Card -->
<div class="card">
<h2>Wallet Connect</h2>
<button class="btn btn-wallet" onclick="connectWallet()">Connect Wallet</button>
<p id="wallet-status">Wallet not connected</p>
</div>

<!-- Live Profit / Token Info -->
<div class="card">
<h2>Live Profit / Rewards</h2>
<p id="token-balance">Token Balance: 0</p>
<p id="live-profit">0 USD</p>
<button class="btn btn-wallet" onclick="updateProfit()">Update Profit</button>
</div>

<!-- Deposit Section -->
<div class="card">
<h2>Deposit Tokens</h2>
<label for="amount">Amount (Test Token)</label>
<input type="number" id="amount" placeholder="Enter amount">
<label for="easypaisa">EasyPaisa Account</label>
<input type="text" id="easypaisa" value="03491441853">
<button class="btn btn-deposit" onclick="depositTokens()">Deposit</button>
<p id="deposit-status"></p>
</div>
</div>

<!-- WhatsApp Floating Button -->
<div id="whatsapp-btn" onclick="openWhatsApp()">💬</div>

<script>
let provider, signer;
let tokenBalance = 0;
const tokenPrice = 1;

// Wallet connect
async function connectWallet() {
    if (!window.ethereum) return alert("Install MetaMask!");
    await ethereum.request({ method: 'eth_requestAccounts' });
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    const address = await signer.getAddress();
    document.getElementById("wallet-status").innerText = `Wallet connected: ${address}`;
}

// Update Profit
function updateProfit(){
    const profit = (tokenBalance * tokenPrice).toFixed(2);
    document.getElementById("token-balance").innerText = `Token Balance: ${tokenBalance}`;
    document.getElementById("live-profit").innerText = profit + ' USD';
}

// Deposit Tokens simulation
function depositTokens(){
    const amt = parseFloat(document.getElementById("amount").value);
    const account = document.getElementById("easypaisa").value;
    if(!amt || !account) return alert("Fill all fields");
    tokenBalance += amt;
    updateProfit();
    document.getElementById("deposit-status").innerText = `Deposited ${amt} tokens! EasyPaisa: ${account}`;
    alert(`Deposited ${amt} tokens to account ${account}`);
}

// WhatsApp button
function openWhatsApp(){
    const number = "03491441853";
    const url = `https://wa.me/${number}?text=Hello%20Aliza%20Support!`;
    window.open(url, '_blank');
}
</script>
</body>
  </html>
